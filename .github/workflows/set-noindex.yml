name: Set SPLN noindex

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  noindex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add noindex meta tag
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old = '<meta name="robots" content="index, follow">'
          new = '<meta name="robots" content="noindex, nofollow, noarchive">'

          if old in text:
              text = text.replace(old, new, 1)
          elif 'name="robots"' not in text:
              text = text.replace('</head>', '    <meta name="robots" content="noindex, nofollow, noarchive">\n</head>', 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit noindex change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Add noindex directive"
            git push
          fi
